<!-- =====================================================
     WHATSAPP STYLE
===================================================== -->

<style>

.whatsapp {

    position: fixed;

    right: 28px;
    bottom: 30px;

    width: 54px;
    height: 54px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #25D366;

    color: #ffffff;

    border-radius: 50%;

    text-decoration: none;

    z-index: 9999;

    box-shadow:
        0 8px 24px rgba(
            37,
            211,
            102,
            0.28
        );

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


.whatsapp:hover {

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 12px 30px rgba(
            37,
            211,
            102,
            0.40
        );

}


.whatsapp:active {

    transform:
        scale(.96);

}


.whatsapp svg {

    width: 29px;

    height: 29px;

    display: block;

}


@media (max-width: 600px) {

    .whatsapp {

        right: 18px;

        bottom: 20px;

        width: 50px;

        height: 50px;

    }


    .whatsapp svg {

        width: 27px;

        height: 27px;

    }

}

</style>
